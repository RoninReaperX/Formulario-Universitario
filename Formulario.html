<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro QR</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      background-image: url("https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1920&q=100");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* CAPA OSCURA */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 0;
    }

    .sidebar {
      width: 200px;
      background: rgba(17, 24, 39, 0.9);
      color: white;
      padding: 20px;
      z-index: 1;
    }

    .sidebar h2 {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .sidebar p {
      font-size: 14px;
      opacity: 0.7;
    }

    .main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1;
    }

    .card {
      background: rgba(255,255,255,0.95);
      padding: 30px;
      border-radius: 12px;
      width: 380px;
      box-shadow: 0 4px 25px rgba(0,0,0,0.3);
      backdrop-filter: blur(6px);
    }

    h3 {
      margin-bottom: 20px;
      color: #111827;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid #ddd;
      transition: 0.2s;
    }

    input:focus {
      border-color: #2563eb;
      outline: none;
    }

    button {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-primary:hover {
      background: #1e4ed8;
    }

    .btn-secondary {
      margin-top: 10px;
      background: #e5e7eb;
    }

    #qrSection {
      display: none;
      text-align: center;
    }

    canvas {
      margin-top: 15px;
      padding: 10px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

  </style>
</head>

<body>

  <div class="sidebar">
    <h2>Sistema QR</h2>
    <p>Registro de usuarios</p>
  </div>

  <div class="main">
    <div class="card">

      <div id="formSection">
        <h3>Nuevo Registro</h3>

        <input type="text" id="nombre" placeholder="Nombre">
        <input type="text" id="apellido" placeholder="Apellido">
        <input type="text" id="cedula" placeholder="Cédula">
        <input type="text" id="carrera" placeholder="Carrera">
        <input type="text" id="turno" placeholder="Turno">

        <button class="btn-primary" onclick="guardar()">Guardar</button>
      </div>

      <div id="qrSection">
        <h3>QR Generado</h3>
        <canvas id="qr"></canvas>
        <button class="btn-secondary" onclick="volver()">Nuevo registro</button>
      </div>

    </div>
  </div>

  <script>
    function guardar() {
      const datos = {
        nombre: nombre.value,
        apellido: apellido.value,
        cedula: cedula.value,
        carrera: carrera.value,
        turno: turno.value
      };

      if (!datos.nombre || !datos.apellido || !datos.cedula || !datos.carrera || !datos.turno) {
        alert("Completa todos los campos");
        return;
      }

      localStorage.setItem("usuario", JSON.stringify(datos));

      document.querySelectorAll("input").forEach(i => i.value = "");

      document.getElementById("formSection").style.display = "none";
      document.getElementById("qrSection").style.display = "block";

      QRCode.toCanvas(document.getElementById("qr"), JSON.stringify(datos));
    }

    function volver() {
      document.getElementById("qrSection").style.display = "none";
      document.getElementById("formSection").style.display = "block";
    }
  </script>

</body>
</html>
